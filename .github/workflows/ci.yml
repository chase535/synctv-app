name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    inputs:
      native-build-mode:
        description: Use "skip" when the caller already builds release artifacts.
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  # Keep this group distinct from callers of the reusable workflow. GitHub
  # treats concurrency group names as case-insensitive.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  PROTOC_VERSION: "35.1"
  RUST_VERSION: "1.97.1"

jobs:
  quality:
    name: Format, analyze, generate, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}

      - name: Set up Protobuf compiler
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          # install-action represents protoc 35.1 with its semver-compatible 3.35.1 alias.
          tool: protoc@3.${{ env.PROTOC_VERSION }}
          fallback: none

      - name: Resolve Darwin Passkey package dependencies
        working-directory: packages/passkeys_darwin
        run: flutter pub get

      - name: Install Dart Protobuf generator
        run: |
          test "$(protoc --version)" = "libprotoc $PROTOC_VERSION"
          dart pub global activate protoc_plugin 25.0.0

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool packages

      - name: Check automation scripts
        run: |
          find tool -type f -name '*.sh' -print0 | xargs -0 bash -n
          find tool -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Check GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

      - name: Analyze Dart and Flutter code
        run: dart analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Run Darwin Passkey package tests
        working-directory: packages/passkeys_darwin
        run: flutter test

      - name: Run OPAQUE native tests
        run: cargo test --locked --manifest-path packages/synctv_opaque/Cargo.toml

      - name: Verify generated localization and protobuf code
        run: |
          flutter gen-l10n
          bash tool/generate_proto.sh
          git diff --exit-code -- lib/l10n lib/src/generated

  android-native:
    name: Signed Android release APK
    if: >-
      inputs.native-build-mode != 'skip' &&
      (github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SYNCTV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SYNCTV_ANDROID_KEYSTORE_BASE64 }}
      SYNCTV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SYNCTV_ANDROID_KEYSTORE_PASSWORD }}
      SYNCTV_ANDROID_KEY_ALIAS: ${{ secrets.SYNCTV_ANDROID_KEY_ALIAS }}
      SYNCTV_ANDROID_KEY_PASSWORD: ${{ secrets.SYNCTV_ANDROID_KEY_PASSWORD }}
      SYNCTV_BUILT_IN_SERVER_URL: ${{ secrets.SYNCTV_BUILT_IN_SERVER_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: x64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Prepare Android release signing
        shell: bash
        run: |
          set -euo pipefail
          : "${SYNCTV_ANDROID_KEYSTORE_BASE64:?Missing SYNCTV_ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${SYNCTV_ANDROID_KEYSTORE_PASSWORD:?Missing SYNCTV_ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${SYNCTV_ANDROID_KEY_ALIAS:?Missing SYNCTV_ANDROID_KEY_ALIAS repository secret}"
          : "${SYNCTV_ANDROID_KEY_PASSWORD:?Missing SYNCTV_ANDROID_KEY_PASSWORD repository secret}"
          : "${SYNCTV_BUILT_IN_SERVER_URL:?Missing SYNCTV_BUILT_IN_SERVER_URL repository secret}"

          keystore_path="$RUNNER_TEMP/synctv-release.jks"
          printf '%s' "$SYNCTV_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$SYNCTV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SYNCTV_ANDROID_KEY_ALIAS" >/dev/null
          echo "SYNCTV_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Configure Android release plugins
        # Work around flutter/flutter#169336 for --no-pub release builds.
        run: flutter build apk --config-only

      - name: Build signed universal Android release APK
        shell: bash
        run: |
          flutter build apk \
            --release \
            --no-pub \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define="SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --split-debug-info build/symbols/ci-android

      - name: Verify Android release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          bash tool/ci/verify_android_artifact.sh "$apk"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            if ! unzip -Z1 "$apk" | grep -Fx "lib/$abi/libapp.so" >/dev/null; then
              echo "Missing Flutter runtime for Android ABI: $abi" >&2
              exit 1
            fi
          done

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Package Android release APK
        shell: bash
        run: |
          set -euo pipefail
          artifact_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          artifact_version="${artifact_version%$'\r'}"
          test -n "$artifact_version"
          install -d dist
          install -m 0644 \
            build/app/outputs/flutter-apk/app-release.apk \
            "dist/SyncTV-$artifact_version-android-universal-signed.apk"

      - name: Upload Android release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux-native:
    name: Linux ${{ matrix.architecture }} native release
    if: >-
      inputs.native-build-mode != 'skip' &&
      (github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      SYNCTV_BUILT_IN_SERVER_URL: ${{ secrets.SYNCTV_BUILT_IN_SERVER_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            flutter-architecture: x64
            flutter-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            flutter-architecture: arm64
            flutter-target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: bash tool/ci/install_linux_build_dependencies.sh

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: ${{ matrix.flutter-architecture }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Build and package Linux release
        shell: bash
        run: |
          set -euo pipefail
          : "${SYNCTV_BUILT_IN_SERVER_URL:?Missing SYNCTV_BUILT_IN_SERVER_URL repository secret}"
          artifact_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          artifact_version="${artifact_version%$'\r'}"
          test -n "$artifact_version"

          flutter build linux \
            --release \
            --no-pub \
            --target-platform "${{ matrix.flutter-target }}" \
            --dart-define="SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --split-debug-info "build/symbols/linux-${{ matrix.architecture }}"
          bash tool/ci/strip_linux_release.sh
          bash tool/ci/package_release.sh linux \
            "${{ matrix.architecture }}" "$artifact_version" dist
          test -f "dist/SyncTV-$artifact_version-linux-${{ matrix.architecture }}.deb"
          test -f "dist/SyncTV-$artifact_version-linux-${{ matrix.architecture }}.tar.gz"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-native:
    name: Windows x64 native release
    if: >-
      inputs.native-build-mode != 'skip' &&
      (github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SYNCTV_BUILT_IN_SERVER_URL: ${{ secrets.SYNCTV_BUILT_IN_SERVER_URL }}

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: x64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: x86_64-pc-windows-msvc

      - name: Build and package Windows release
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNCTV_BUILT_IN_SERVER_URL)) {
            throw 'Missing SYNCTV_BUILT_IN_SERVER_URL repository secret'
          }
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:\s*' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($versionLine)) {
            throw 'pubspec.yaml does not contain a version'
          }
          $artifactVersion = ($versionLine -replace '^version:\s*', '').Trim()

          flutter build windows `
            --release `
            --no-pub `
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$env:SYNCTV_BUILT_IN_SERVER_URL" `
            --split-debug-info build/symbols/windows-x64
          ./tool/ci/verify_windows_architecture.ps1 -Architecture x64
          ./tool/ci/package_release.ps1 `
            -Version $artifactVersion `
            -Architecture x64 `
            -OutputDirectory dist `
            -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
