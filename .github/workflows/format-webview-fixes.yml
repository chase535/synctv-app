name: Format WebView fixes

on:
  push:
    branches: ["feat/iqiyi-tencent-watch-together"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          architecture: x64
          cache: true

      - name: Format touched Dart files and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/core/web/official_site_login_target.dart \
            lib/features/media_library/presentation/add_media/official_web_playback_add_media_form.dart \
            lib/features/room/domain/web_playback_bridge_script.dart \
            test/core/web/official_site_login_target_test.dart
          rm .github/workflows/format-webview-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/web/official_site_login_target.dart \
            lib/features/media_library/presentation/add_media/official_web_playback_add_media_form.dart \
            lib/features/room/domain/web_playback_bridge_script.dart \
            test/core/web/official_site_login_target_test.dart \
            .github/workflows/format-webview-fixes.yml
          git commit -m "style: format official WebView login fixes"
          git push
