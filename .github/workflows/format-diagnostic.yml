name: Format diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"
          architecture: x64
          cache: true

      - name: Print formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/media_library/application/web_playback_link_resolver.dart \
            lib/features/media_library/presentation/add_media/official_web_playback_add_media_form.dart \
            test/features/media_library/application/web_playback_link_resolver_test.dart \
            test/features/room/domain/web_playback_media_identity_test.dart
          git diff -- \
            lib/features/media_library/application/web_playback_link_resolver.dart \
            lib/features/media_library/presentation/add_media/official_web_playback_add_media_form.dart \
            test/features/media_library/application/web_playback_link_resolver_test.dart \
            test/features/room/domain/web_playback_media_identity_test.dart
          test -z "$(git status --porcelain -- \
            lib/features/media_library/application/web_playback_link_resolver.dart \
            lib/features/media_library/presentation/add_media/official_web_playback_add_media_form.dart \
            test/features/media_library/application/web_playback_link_resolver_test.dart \
            test/features/room/domain/web_playback_media_identity_test.dart)"
