name: Refresh WebView lockfile

on:
  push:
    branches: ["feat/iqiyi-tencent-watch-together"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          architecture: x64
          cache: true

      - name: Refresh lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          rm .github/workflows/refresh-webview-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock .github/workflows/refresh-webview-lock.yml
          git commit -m "build: refresh desktop WebView lockfile"
          git push
