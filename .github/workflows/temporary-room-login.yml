name: Temporary room login patch

on:
  push:
    branches:
      - feat/iqiyi-tencent-watch-together

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/iqiyi-tencent-watch-together
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.8'
          architecture: x64
          cache: true

      - name: Patch and format room login controls
        shell: bash
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > "$RUNNER_TEMP/patch_room_login.py"
          python3 "$RUNNER_TEMP/patch_room_login.py"
          dart format lib/features/room/presentation/room_screen.dart test/core/web/official_site_login_target_test.dart

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-room-login.yml
          git add lib/features/room/presentation/room_screen.dart test/core/web/official_site_login_target_test.dart
          git commit -m 'feat: add account login control to room web playback'
          git push origin HEAD:feat/iqiyi-tencent-watch-together
