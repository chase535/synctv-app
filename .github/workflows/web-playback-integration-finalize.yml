name: Web playback integration finalize

on:
  push:
    branches: ["feat/iqiyi-tencent-watch-together"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/iqiyi-tencent-watch-together

      - name: Set up pinned build toolchain
        uses: ./.github/actions/setup-build

      - name: Apply incremental lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines):
              return '\n'.join(lines) + '\n'

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          def require(path, needle, expected, label):
              text = Path(path).read_text()
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(
                      f'{label}: expected {expected} occurrences, found {count}'
                  )

          client = 'lib/features/room/infrastructure/desktop_web_playback_client_io.dart'

          # Guard the lifecycle fixes already validated by the previous full run.
          require(client, '      await session.initialize(uri);\n', 1, 'initial launch is awaited')
          require(client, '    await _webview.launch(uri.toString());\n', 2, 'webview navigations are awaited')
          require(client, '      _runtime.forgetCommand(command.id);\n', 1, 'JS invocation failure clears command')
          require(
              'lib/features/room/application/web_playback_coordinator.dart',
              '      if (!_closed) _onError?.call(error, stackTrace);\n',
              4,
              'coordinator teardown guards',
          )
          require(
              'lib/features/room/presentation/room_screen.dart',
              "Navigate official web playback failed: $error\\n$stackTrace",
              1,
              'navigation recovery',
          )

          replace_once(
              'pubspec.yaml',
              block(
                  '  # Temporary fork pin: surface WebView launch failures to callers.',
                  '  # Remove once upstream releases the Future<void> launch contract.',
                  '  desktop_webview_window:',
                  '    git:',
                  '      url: https://github.com/chase535/flutter-plugins.git',
                  '      ref: 135f963364ca6a4cb7722f967d113103952bdae6',
                  '      path: packages/desktop_webview_window',
              ),
              block(
                  '  # Temporary fork pin: propagate desktop WebView lifecycle failures.',
                  '  # Remove once upstream ships awaitable launch, script registration, and close.',
                  '  desktop_webview_window:',
                  '    git:',
                  '      url: https://github.com/chase535/flutter-plugins.git',
                  '      ref: 28267bb8fefbf60cc0a2daaf760dc2b7a5d7b341',
                  '      path: packages/desktop_webview_window',
              ),
              'upgrade verified desktop webview fork',
          )

          replace_once(
              client,
              block(
                  '    _webview.addScriptToExecuteOnDocumentCreated(',
                  '      webPlaybackBridgeBootstrapScript,',
                  '    );',
              ),
              block(
                  '    await _webview.addScriptToExecuteOnDocumentCreated(',
                  '      webPlaybackBridgeBootstrapScript,',
                  '    );',
              ),
              'await bridge bootstrap registration',
          )

          replace_once(
              client,
              block(
                  '    if (_closed) return;',
                  '    _webview.close();',
                  '    await _webview.onClose;',
              ),
              block(
                  '    if (_closed) return;',
                  '    await _webview.close();',
                  '    await _webview.onClose;',
                  '    _finishClosed();',
              ),
              'await and finalize webview close request',
          )

          tracker_test = 'test/features/room/domain/web_playback_command_tracker_test.dart'
          replace_once(
              tracker_test,
              "    test('forget removes a command after JavaScript invocation failure', () {\n",
              block(
                  "    test('command error still acknowledges a pending command', () {",
                  '      final tracker = WebPlaybackCommandTracker();',
                  "      tracker.remember(WebPlaybackCommand.play('play-rejected'));",
                  '',
                  '      expect(',
                  '        tracker.acknowledge(',
                  '          const WebPlaybackBridgeMessage(',
                  '            type: WebPlaybackBridgeEventType.error,',
                  '            source: WebPlaybackBridgeEventSource.command,',
                  "            commandId: 'play-rejected',",
                  "            errorMessage: 'blocked by advertisement',",
                  '          ),',
                  '        ),',
                  '        isTrue,',
                  '      );',
                  '      expect(tracker.pendingCount, 0);',
                  '    });',
                  '',
                  "    test('forget removes a command after JavaScript invocation failure', () {",
              ),
              'preserve async command error acknowledgement',
          )
          PY

          flutter pub get
          dart format lib test tool packages
          rm .github/workflows/web-playback-integration-finalize.yml
          git diff --check
          dart format --output=none --set-exit-if-changed lib test tool packages

      - name: Analyze full client
        run: flutter analyze

      - name: Test full client
        run: flutter test

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/iqiyi-tencent-watch-together
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/iqiyi-tencent-watch-together)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(room): await complete desktop webview lifecycle"
          git push origin HEAD:feat/iqiyi-tencent-watch-together
