name: Feature iQiyi Tencent core implementation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/iqiyi-tencent-shared-provider
    paths:
      - .github/workflows/feature-iqiyi-tencent-core.yml
      - tool/feature_iqiyi_tencent_core_patch.py

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iqiyi-tencent-shared-provider
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          flutter-version: "3.44.8"
          rust-version: "1.97.1"
      - name: Apply core implementation
        run: python3 tool/feature_iqiyi_tencent_core_patch.py
      - name: Format and verify core implementation
        run: |
          dart format lib/contracts/source_config_codec.dart \
            lib/data/synctv_api/synctv_api_client.dart \
            lib/data/synctv_api/synctv_api_facades.dart \
            lib/data/synctv_api/synctv_provider_service.dart \
            test/contracts/iqiyi_tencent_codec_test.dart
          flutter test test/contracts/iqiyi_tencent_codec_test.dart
          dart analyze --fatal-infos
      - name: Commit implementation and remove helper files
        run: |
          git rm .github/workflows/feature-iqiyi-tencent-core.yml \
            tool/feature_iqiyi_tencent_core_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/contracts/source_config_codec.dart \
            lib/data/synctv_api/synctv_api_client.dart \
            lib/data/synctv_api/synctv_api_facades.dart \
            lib/data/synctv_api/synctv_provider_service.dart \
            test/contracts/iqiyi_tencent_codec_test.dart
          git commit -m "Add iQiyi and Tencent provider core support"
          git push origin HEAD:feat/iqiyi-tencent-shared-provider
