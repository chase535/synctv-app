name: Temporary web login refresh patch

on:
  push:
    branches:
      - feat/iqiyi-tencent-watch-together

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/iqiyi-tencent-watch-together

      - name: Patch login completion handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/room/presentation/room_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_state = '''  bool _webPlaybackOpening = false;
            bool _webPlaybackAutoOpenSuppressed = false;'''
          new_state = '''  bool _webPlaybackOpening = false;
            bool _webPlaybackLoginOpening = false;
            bool _webPlaybackAutoOpenSuppressed = false;'''
          if old_state not in text:
              if new_state not in text:
                  raise SystemExit('web playback state marker not found')
          else:
              text = text.replace(old_state, new_state, 1)

          start_marker = '  Future<void> _openCurrentWebPlaybackLogin() async {'
          end_marker = '\n  Widget _buildWebPlaybackState()'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('login method start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('login method end marker not found')
          method = '''  Future<void> _openCurrentWebPlaybackLogin() async {
            final provider = _webPlaybackProvider;
            const loginClient = OfficialSiteLoginClient();
            if (provider == null || !loginClient.supported) {
              if (mounted) {
                AppNotifications.showWarning(context, '当前平台暂不支持官方网页登录');
              }
              return;
            }
            if (_webPlaybackLoginOpening) return;

            final providerName = provider == WebPlaybackProvider.iqiyi
                ? '爱奇艺'
                : '腾讯视频';
            if (mounted) setState(() => _webPlaybackLoginOpening = true);
            try {
              // OfficialSiteLoginClient.open completes only after the dedicated
              // official login window closes. The login and playback windows use
              // the same persistent WebView2 profile, so recreating the playback
              // session picks up the latest official cookies without exporting
              // them through SyncTV.
              await loginClient.open(provider);
              if (!mounted || _isDisposing) return;

              final status = _currentStatus;
              final rawUri = _webPlaybackUri ??
                  Uri.tryParse(status?.entry?.url ?? '');
              if (status != null &&
                  rawUri != null &&
                  _webPlaybackProvider == provider) {
                await _disposeWebPlayback(clearUri: false);
                if (!mounted || _isDisposing) return;
                _webPlaybackAutoOpenSuppressed = false;
                await _applyWebPlaybackStatus(status, rawUri, applySync: true);
                if (!mounted || _isDisposing) return;
                AppNotifications.showSuccess(
                  context,
                  '$providerName 登录窗口已关闭，已重新加载官方播放器以应用最新登录状态。',
                );
              } else {
                AppNotifications.showInfo(
                  context,
                  '$providerName 登录窗口已关闭。',
                );
              }
            } catch (error) {
              if (mounted) {
                AppNotifications.showError(context, '打开官方登录页失败：$error');
              }
            } finally {
              if (mounted && !_isDisposing) {
                setState(() => _webPlaybackLoginOpening = false);
              }
            }
          }
          '''
          text = text[:start] + method + text[end:]

          old_button = '''            OutlinedButton.icon(
                    key: const Key('room_official_web_login_button'),
                    onPressed: loginSupported
                        ? () => unawaited(_openCurrentWebPlaybackLogin())
                        : null,
                    icon: const Icon(Icons.login_rounded),
                    label: Text('登录 $providerName 账号'),
                  ),'''
          new_button = '''            OutlinedButton.icon(
                    key: const Key('room_official_web_login_button'),
                    onPressed: loginSupported && !_webPlaybackLoginOpening
                        ? () => unawaited(_openCurrentWebPlaybackLogin())
                        : null,
                    icon: _webPlaybackLoginOpening
                        ? const SizedBox.square(
                            dimension: 16,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : const Icon(Icons.login_rounded),
                    label: Text(
                      _webPlaybackLoginOpening
                          ? '等待关闭登录窗口…'
                          : '登录 $providerName 账号',
                    ),
                  ),'''
          if old_button not in text:
              if new_button not in text:
                  raise SystemExit('login button marker not found')
          else:
              text = text.replace(old_button, new_button, 1)

          old_note = '登录窗口与官方播放器使用同一本机 WebView2 配置目录；房间同步只同步播放状态，不会向其他成员分发账号 Cookie、验证码或 DRM 信息。'
          new_note = '每位房间成员仍需通过爱奇艺或腾讯视频官方页面在自己的设备上获得播放授权；登录窗口关闭后会自动重新加载当前播放器。房间同步只同步播放状态，不分发 Cookie、验证码、会员凭证或 DRM 信息。'
          if old_note not in text:
              if new_note not in text:
                  raise SystemExit('login note marker not found')
          else:
              text = text.replace(old_note, new_note, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          if git diff --quiet -- lib/features/room/presentation/room_screen.dart; then
            echo 'No patch required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/room/presentation/room_screen.dart
          git commit -m 'fix: reload official playback after login'
          git push origin HEAD:feat/iqiyi-tencent-watch-together
