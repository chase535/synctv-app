name: Feature iQiyi Tencent UI

on:
  push:
    branches:
      - feat/iqiyi-tencent-shared-provider
    paths:
      - .github/workflows/feature-iqiyi-tencent-ui.yml
      - tool/feature_iqiyi_tencent_ui_patch.py

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLUTTER_VERSION: "3.44.8"
      RUST_VERSION: "1.97.1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/iqiyi-tencent-shared-provider
          fetch-depth: 0

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}

      - name: Patch media dialog
        run: python3 tool/feature_iqiyi_tencent_ui_patch.py

      - name: Format feature files
        run: |
          dart format \
            lib/core/config/distribution_profile.dart \
            lib/core/presentation/media_provider_brand.dart \
            lib/features/media_library/presentation/add_media_dialog.dart \
            lib/features/media_library/presentation/add_media/provider_web_session_add_media_form.dart \
            lib/features/providers/domain/provider_web_session_spec.dart \
            lib/features/providers/infrastructure/provider_web_session_capture_io.dart \
            lib/features/providers/infrastructure/provider_web_session_capture_web.dart

      - name: Analyze application
        run: dart analyze --fatal-infos

      - name: Run source configuration tests
        run: flutter test test/contracts/source_config_codec_test.dart

      - name: Commit UI implementation and remove helper files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/feature-iqiyi-tencent-ui.yml tool/feature_iqiyi_tencent_ui_patch.py
          git add \
            lib/core/config/distribution_profile.dart \
            lib/core/presentation/media_provider_brand.dart \
            lib/features/media_library/presentation/add_media_dialog.dart \
            lib/features/media_library/presentation/add_media/provider_web_session_add_media_form.dart \
            lib/features/providers/domain/provider_web_session_spec.dart \
            lib/features/providers/infrastructure/provider_web_session_capture_io.dart \
            lib/features/providers/infrastructure/provider_web_session_capture_web.dart
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Add iQiyi and Tencent WebSession media UI"
          git push origin HEAD:feat/iqiyi-tencent-shared-provider
