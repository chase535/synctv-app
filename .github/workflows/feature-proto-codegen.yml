name: Feature protobuf codegen

on:
  push:
    branches:
      - feat/iqiyi-tencent-shared-provider
    paths:
      - proto/**
      - .github/workflows/feature-proto-codegen.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: "3.44.8"
      PROTOC_VERSION: "35.1"
      RUST_VERSION: "1.97.1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/iqiyi-tencent-shared-provider

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}

      - name: Set up Protobuf compiler
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: protoc@3.${{ env.PROTOC_VERSION }}
          fallback: none

      - name: Generate tracked Dart protobuf files
        shell: bash
        run: |
          set -euo pipefail
          test "$(protoc --version)" = "libprotoc $PROTOC_VERSION"
          dart pub global activate protoc_plugin 25.0.0
          bash tool/generate_proto.sh
          dart format lib/src/generated

      - name: Commit generated files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/feature-proto-codegen.yml
          git add lib/src/generated
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Regenerate protobuf bindings for web sessions"
          git push origin HEAD:feat/iqiyi-tencent-shared-provider
