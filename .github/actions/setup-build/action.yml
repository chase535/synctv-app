name: Set up SyncTV build toolchain
description: Install pinned Flutter and Rust toolchains and restore project dependencies.

inputs:
  flutter-version:
    description: Flutter SDK version.
    required: false
    default: "3.44.8"
  flutter-revision:
    description: Immutable Flutter framework revision for source installations.
    required: false
    default: "058e0af2c2b57e369d905a03ac9748b0ebf543c6"
  flutter-architecture:
    description: Flutter SDK host architecture.
    required: false
    default: "x64"
  rust-version:
    description: Rust toolchain version used by the OPAQUE native asset.
    required: false
    default: "1.97.1"
  rust-targets:
    description: Optional comma-separated Rust compilation targets.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select latest stable Xcode
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Cache pinned Flutter source SDK
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.tool_cache }}/flutter-${{ inputs.flutter-version }}-${{ runner.os }}-${{ inputs.flutter-architecture }}
        key: flutter-source-${{ runner.os }}-${{ inputs.flutter-architecture }}-${{ inputs.flutter-revision }}

    - name: Set up pinned Flutter source SDK on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        FLUTTER_ROOT: ${{ runner.tool_cache }}/flutter-${{ inputs.flutter-version }}-${{ runner.os }}-${{ inputs.flutter-architecture }}
        FLUTTER_REVISION: ${{ inputs.flutter-revision }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        set -euo pipefail

        mkdir -p "$FLUTTER_ROOT"
        if ! git -C "$FLUTTER_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
          git init "$FLUTTER_ROOT"
        fi

        if git -C "$FLUTTER_ROOT" remote get-url origin >/dev/null 2>&1; then
          git -C "$FLUTTER_ROOT" remote set-url origin https://github.com/flutter/flutter.git
        else
          git -C "$FLUTTER_ROOT" remote add origin https://github.com/flutter/flutter.git
        fi

        git -C "$FLUTTER_ROOT" fetch --depth 1 origin \
          "+refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"

        resolved_revision="$(git -C "$FLUTTER_ROOT" rev-parse "refs/tags/$FLUTTER_VERSION^{commit}")"
        if [[ "$resolved_revision" != "$FLUTTER_REVISION" ]]; then
          echo "Flutter $FLUTTER_VERSION resolved to $resolved_revision; expected $FLUTTER_REVISION" >&2
          exit 1
        fi

        git -C "$FLUTTER_ROOT" checkout --force --detach "refs/tags/$FLUTTER_VERSION"
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        "$FLUTTER_ROOT/bin/flutter" --version

    - name: Set up pinned Flutter source SDK on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        FLUTTER_ROOT: ${{ runner.tool_cache }}/flutter-${{ inputs.flutter-version }}-${{ runner.os }}-${{ inputs.flutter-architecture }}
        FLUTTER_REVISION: ${{ inputs.flutter-revision }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path $env:FLUTTER_ROOT | Out-Null

        if (-not (Test-Path -LiteralPath (Join-Path $env:FLUTTER_ROOT '.git'))) {
          & git -C $env:FLUTTER_ROOT init
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize the Flutter source repository.' }
        }

        & git -C $env:FLUTTER_ROOT remote get-url origin 2>$null | Out-Null
        if ($LASTEXITCODE -eq 0) {
          & git -C $env:FLUTTER_ROOT remote set-url origin https://github.com/flutter/flutter.git
        }
        else {
          & git -C $env:FLUTTER_ROOT remote add origin https://github.com/flutter/flutter.git
        }
        if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the Flutter source remote.' }

        & git -C $env:FLUTTER_ROOT fetch --depth 1 origin "+refs/tags/$($env:FLUTTER_VERSION):refs/tags/$($env:FLUTTER_VERSION)"
        if ($LASTEXITCODE -ne 0) { throw "Failed to fetch Flutter $($env:FLUTTER_VERSION)." }

        $resolvedRevision = (& git -C $env:FLUTTER_ROOT rev-parse "refs/tags/$($env:FLUTTER_VERSION)^{commit}").Trim()
        if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve the Flutter source revision.' }
        if ($resolvedRevision -ne $env:FLUTTER_REVISION) {
          throw "Flutter $($env:FLUTTER_VERSION) resolved to $resolvedRevision; expected $($env:FLUTTER_REVISION)"
        }

        & git -C $env:FLUTTER_ROOT checkout --force --detach "refs/tags/$($env:FLUTTER_VERSION)"
        if ($LASTEXITCODE -ne 0) { throw 'Failed to check out the pinned Flutter source tag.' }

        $flutterBin = Join-Path $env:FLUTTER_ROOT 'bin'
        $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $flutterBin 'flutter.bat') --version
        if ($LASTEXITCODE -ne 0) { throw 'Flutter bootstrap failed.' }

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.rust-targets }}

    - name: Disable tool analytics
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        flutter config --no-analytics
        dart --disable-analytics

    - name: Restore Dart dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile

    - name: Patch Windows arm64 native dependencies
      if: runner.os == 'Windows' && inputs.flutter-architecture == 'arm64'
      shell: pwsh
      run: ./tool/ci/prepare_windows_arm64_dependencies.ps1
